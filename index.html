<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Songless — Guess the song</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..900;1,9..144,500..900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: oklch(0.952 0.028 84);
  --surface: oklch(0.982 0.014 86);
  --ink: oklch(0.235 0.045 52);
  --ink-soft: oklch(0.44 0.05 58);
  --line: oklch(0.87 0.035 78);
  --accent: oklch(0.645 0.195 41);
  --accent-deep: oklch(0.505 0.175 39);
  --accent-wash: oklch(0.90 0.06 48);
  --good: oklch(0.53 0.135 152);
  --good-wash: oklch(0.92 0.05 150);
  --bad: oklch(0.56 0.185 27);
  --bad-wash: oklch(0.91 0.05 32);
  --radius: 14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Hanken Grotesk",sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  background-image:
    repeating-radial-gradient(circle at 50% -20%, transparent 0 46px, oklch(0.93 0.03 82 / .7) 46px 47px);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}

.page{
  width:min(680px, 100%);
  padding:clamp(16px, 3vw, 32px);
  display:flex;
  flex-direction:column;
  flex:1;
}

header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  padding-bottom:clamp(18px, 3vw, 28px);
  border-bottom:2px solid var(--ink);
  animation:rise .6s cubic-bezier(.22,1,.36,1) both;
}
.logo{
  font-family:"Fraunces",serif;
  font-optical-sizing:auto;
  font-weight:900;
  font-size:clamp(30px, 6vw, 44px);
  letter-spacing:-0.02em;
  line-height:1;
  display:flex;
  align-items:center;
  gap:.35em;
}
.logo .disc{
  width:.72em;height:.72em;border-radius:50%;
  background:
    radial-gradient(circle, var(--accent) 0 26%, var(--ink) 27% 34%, transparent 35%),
    repeating-radial-gradient(circle, var(--ink) 0 1.5px, transparent 1.5px 4px),
    var(--ink);
  position:relative;
  flex:none;
}
.logo em{
  font-style:italic;
  font-weight:600;
  color:var(--accent-deep);
}
.tagline{
  font-size:13px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-soft);
  text-align:right;
}

.genres{
  margin-top:clamp(16px, 3vw, 24px);
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  animation:rise .6s cubic-bezier(.22,1,.36,1) .05s both;
}
.genres-label{
  font-size:12px;
  font-weight:700;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-right:2px;
}
.chip{
  padding:8px 15px;
  border-radius:99px;
  border:1.5px solid var(--line);
  background:var(--surface);
  font-weight:600;
  font-size:13.5px;
  color:var(--ink-soft);
  transition:border-color .2s, color .2s, transform .2s cubic-bezier(.22,1,.36,1), background .2s;
}
.chip:hover:not(:disabled){border-color:var(--ink);color:var(--ink);transform:translateY(-1px)}
.chip:focus-visible{outline:3px solid var(--accent-deep);outline-offset:2px}
.chip.active{
  background:var(--ink);
  border-color:var(--ink);
  color:oklch(0.96 0.02 84);
}
.chip:disabled{opacity:.45;cursor:wait}

.status{
  margin-top:clamp(14px, 2.5vw, 22px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  animation:rise .6s cubic-bezier(.22,1,.36,1) .08s both;
}
.status p{font-size:15px;font-weight:600;color:var(--ink-soft)}
.status p strong{color:var(--ink)}
.attempts{
  display:flex;
  gap:7px;
  align-items:center;
}
.attempt-dot{
  width:34px;height:10px;
  border-radius:99px;
  background:var(--surface);
  border:1.5px solid var(--line);
  transition:all .35s cubic-bezier(.22,1,.36,1);
}
.attempt-dot.current{
  border-color:var(--accent);
  animation:pulse 1.6s ease-in-out infinite;
}
.attempt-dot.used{background:var(--bad);border-color:var(--bad)}
.attempt-dot.won{background:var(--good);border-color:var(--good)}

.stage{
  margin-top:clamp(20px, 4vw, 30px);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(16px, 3vw, 22px);
  animation:rise .6s cubic-bezier(.22,1,.36,1) .16s both;
}

.vinyl-wrap{
  position:relative;
  width:clamp(180px, 42vw, 230px);
  aspect-ratio:1;
}
.vinyl{
  width:100%;height:100%;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%, oklch(0.98 0.01 85 / .14), transparent 55%),
    repeating-radial-gradient(circle, oklch(0.30 0.03 55) 0 2px, oklch(0.245 0.03 55) 2px 5px),
    oklch(0.245 0.03 55);
  box-shadow:
    0 18px 40px -14px oklch(0.3 0.05 50 / .5),
    inset 0 0 0 1px oklch(0.4 0.04 55 / .6);
  display:grid;
  place-items:center;
  animation:spin 3.2s linear infinite;
  animation-play-state:paused;
}
.vinyl.playing{animation-play-state:running}
.vinyl::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:conic-gradient(from 200deg, transparent 0deg, oklch(1 0 0 / .07) 40deg, transparent 110deg);
  pointer-events:none;
}
.vinyl-label{
  width:38%;
  aspect-ratio:1;
  border-radius:50%;
  background:var(--accent);
  background-image:radial-gradient(circle at 40% 35%, oklch(0.72 0.17 48), var(--accent));
  display:grid;
  place-items:center;
  box-shadow:inset 0 0 0 2px oklch(0.98 0.02 80 / .35);
}
.vinyl-label span{
  width:22%;
  aspect-ratio:1;
  border-radius:50%;
  background:var(--bg);
  box-shadow:inset 0 1px 3px oklch(0.3 0.05 50 / .6);
}
.play-btn{
  position:absolute;
  inset:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  transition:transform .25s cubic-bezier(.22,1,.36,1);
}
.play-btn:hover{transform:scale(1.04)}
.play-btn:active{transform:scale(.97)}
.play-btn:focus-visible{outline:3px solid var(--accent-deep);outline-offset:6px}
.play-icon{
  width:54px;height:54px;
  border-radius:50%;
  background:var(--surface);
  display:grid;
  place-items:center;
  box-shadow:0 6px 18px -6px oklch(0.2 0.05 50 / .55);
  transition:background .2s;
}
.play-btn:hover .play-icon{background:#fff}
.play-icon svg{width:22px;height:22px;fill:var(--ink)}
.snippet-bar{
  width:min(320px, 70vw);
  height:6px;
  border-radius:99px;
  background:var(--line);
  overflow:hidden;
}
.snippet-bar i{
  display:block;
  height:100%;
  width:0%;
  border-radius:99px;
  background:linear-gradient(90deg, var(--accent-deep), var(--accent));
}
.snippet-hint{
  font-size:13.5px;
  font-weight:600;
  color:var(--ink-soft);
  min-height:1.4em;
  text-align:center;
}
.snippet-hint strong{color:var(--accent-deep)}

.guess-zone{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:10px;
  animation:rise .6s cubic-bezier(.22,1,.36,1) .24s both;
}
.guess-row{
  display:flex;
  gap:8px;
}
.combo{
  position:relative;
  flex:1;
  min-width:0;
}
.guess-row input{
  width:100%;
  padding:14px 18px;
  border-radius:var(--radius);
  border:2px solid var(--ink);
  background:var(--surface);
  font-size:16px;
  font-weight:500;
  transition:box-shadow .2s, opacity .2s;
}
.guess-row input::placeholder{color:oklch(0.55 0.04 60)}
.guess-row input:focus{outline:none;box-shadow:4px 4px 0 var(--accent)}
.guess-row input:disabled{opacity:.45}
.btn{
  padding:14px 22px;
  border-radius:var(--radius);
  font-weight:700;
  font-size:15.5px;
  border:2px solid var(--ink);
  transition:transform .15s cubic-bezier(.22,1,.36,1), box-shadow .15s, background .2s;
  white-space:nowrap;
}
.btn:focus-visible{outline:3px solid var(--accent-deep);outline-offset:3px}
.btn-primary{
  background:var(--accent);
  color:oklch(0.99 0.008 85);
  box-shadow:4px 4px 0 var(--ink);
}
.btn-primary:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn-primary:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-ghost{
  background:transparent;
  color:var(--ink-soft);
  border-color:var(--line);
  font-weight:600;
}
.btn-ghost:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed}

.ac{
  position:absolute;
  z-index:30;
  top:calc(100% + 8px);
  left:0;
  right:0;
  background:var(--surface);
  border:2px solid var(--ink);
  border-radius:var(--radius);
  box-shadow:5px 5px 0 var(--accent-wash);
  overflow:hidden auto;
  max-height:min(300px, 46vh);
  display:none;
  overscroll-behavior:contain;
  animation:drop .18s cubic-bezier(.22,1,.36,1) both;
}
.ac.show{display:block}
.ac::-webkit-scrollbar{width:10px}
.ac::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid var(--surface)}
.ac-item{
  display:flex;
  flex-direction:column;
  gap:1px;
  width:100%;
  text-align:left;
  padding:10px 16px;
  border-bottom:1px solid var(--line);
  transition:background .12s;
}
.ac-item:last-child{border-bottom:none}
.ac-item .t{
  font-weight:700;
  font-size:15px;
  line-height:1.25;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.ac-item .a{
  font-size:12.5px;
  font-weight:600;
  color:var(--ink-soft);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.ac-item mark{background:var(--accent-wash);color:inherit;border-radius:3px;padding:0 1px}
.ac-item[aria-selected="true"]{background:var(--accent-wash)}
.ac-item[aria-selected="true"] .a{color:var(--accent-deep)}
.ac-empty{
  padding:12px 16px;
  font-size:14px;
  font-weight:600;
  color:var(--ink-soft);
  font-style:italic;
}

.history{
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:4px;
}
.history li{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 16px;
  border-radius:10px;
  font-weight:600;
  font-size:15px;
  animation:drop .4s cubic-bezier(.22,1,.36,1) both;
}
.history li.wrong{
  background:var(--bad-wash);
  color:var(--bad);
  border-left:5px solid var(--bad);
}
.history li.right{
  background:var(--good-wash);
  color:var(--good);
  border-left:5px solid var(--good);
}
.history li.skipped{
  background:var(--surface);
  color:var(--ink-soft);
  border-left:5px solid var(--line);
  font-style:italic;
}
.history .n{
  font-family:"Fraunces",serif;
  font-weight:900;
  font-size:17px;
  opacity:.75;
  min-width:1.2em;
}
.history .txt{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.result{
  margin-top:clamp(18px, 3vw, 26px);
  border:2px solid var(--ink);
  border-radius:18px;
  background:var(--surface);
  box-shadow:6px 6px 0 var(--accent);
  padding:clamp(20px, 4vw, 28px);
  display:none;
  animation:pop .5s cubic-bezier(.22,1,.36,1) both;
}
.result.show{display:block}
.result-head{
  font-family:"Fraunces",serif;
  font-weight:900;
  font-size:clamp(24px, 5vw, 32px);
  letter-spacing:-0.01em;
  line-height:1.1;
}
.result-head.good{color:var(--good)}
.result-head.bad{color:var(--bad)}
.result-sub{
  margin-top:6px;
  font-size:15px;
  font-weight:600;
  color:var(--ink-soft);
}
.song-card{
  margin-top:18px;
  display:flex;
  gap:16px;
  align-items:center;
}
.song-art{
  width:96px;height:96px;
  border-radius:12px;
  object-fit:cover;
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--line);
  flex:none;
}
.song-meta{min-width:0}
.song-title{
  font-family:"Fraunces",serif;
  font-weight:800;
  font-size:20px;
  line-height:1.15;
}
.song-artist{font-weight:600;color:var(--ink-soft);margin-top:2px}
.song-link{
  display:inline-block;
  margin-top:8px;
  font-size:13.5px;
  font-weight:700;
  color:var(--accent-deep);
  text-decoration:none;
  border-bottom:2px solid var(--accent-wash);
  transition:border-color .2s;
}
.song-link:hover{border-color:var(--accent-deep)}
.stats-strip{
  margin-top:20px;
  padding-top:16px;
  border-top:1.5px dashed var(--line);
  display:flex;
  gap:clamp(16px, 5vw, 36px);
}
.stat b{
  font-family:"Fraunces",serif;
  font-weight:900;
  font-size:22px;
  display:block;
}
.stat span{
  font-size:12px;
  font-weight:700;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.result-actions{margin-top:20px;display:flex;justify-content:flex-end}

footer{
  margin-top:auto;
  padding:clamp(24px, 5vw, 40px) 0 18px;
  text-align:center;
  font-size:12.5px;
  font-weight:600;
  color:oklch(0.55 0.04 62);
}
footer a{color:inherit}

.toast{
  position:fixed;
  left:50%;
  bottom:28px;
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);
  color:var(--bg);
  padding:11px 20px;
  border-radius:99px;
  font-weight:600;
  font-size:14.5px;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s, transform .3s cubic-bezier(.22,1,.36,1);
  z-index:10;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 oklch(0.645 0.195 41 / .45)}
  50%{box-shadow:0 0 0 5px oklch(0.645 0.195 41 / 0)}
}
@keyframes shake{
  10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-6px)}
  40%,60%{transform:translateX(6px)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 class="logo"><span class="disc" aria-hidden="true"></span>SONG<em>LESS</em></h1>
    <p class="tagline">Guess the<br>song</p>
  </header>

  <div class="genres" id="genreBar" role="group" aria-label="Choose a music genre">
    <span class="genres-label">Genre</span>
  </div>

  <div class="status">
    <p id="statusText">Loading song…</p>
    <div class="attempts" id="attemptDots" aria-label="Attempts"></div>
  </div>

  <main class="stage">
    <div class="vinyl-wrap">
      <div class="vinyl" id="vinyl">
        <div class="vinyl-label"><span></span></div>
      </div>
      <button class="play-btn" id="playBtn" aria-label="Play snippet" disabled>
        <span class="play-icon">
          <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </span>
      </button>
    </div>
    <div class="snippet-bar" aria-hidden="true"><i id="snippetFill"></i></div>
    <p class="snippet-hint" id="snippetHint">Press the record to listen</p>
    <button type="button" class="btn btn-ghost" id="retryBtn" hidden>Try again</button>

    <div class="guess-zone">
      <form class="guess-row" id="guessForm" autocomplete="off">
        <div class="combo">
          <input type="text" id="guessInput" placeholder="Type your guess…" disabled
                 role="combobox" aria-expanded="false" aria-autocomplete="list"
                 aria-controls="acList" autocomplete="off" autocorrect="off" spellcheck="false">
          <div class="ac" id="acList" role="listbox" aria-label="Song suggestions"></div>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn" disabled>Submit</button>
        <button type="button" class="btn btn-ghost" id="skipBtn" disabled>Skip</button>
      </form>
      <ul class="history" id="history"></ul>
    </div>

    <section class="result" id="result" aria-live="polite">
      <h2 class="result-head" id="resultHead"></h2>
      <p class="result-sub" id="resultSub"></p>
      <div class="song-card">
        <img class="song-art" id="songArt" alt="Album artwork" referrerpolicy="no-referrer">
        <div class="song-meta">
          <p class="song-title" id="songTitle"></p>
          <p class="song-artist" id="songArtist"></p>
          <a class="song-link" id="songLink" href="#" target="_blank" rel="noopener">Listen on Apple Music ↗</a>
        </div>
      </div>
      <div class="stats-strip">
        <div class="stat"><b id="statStreak">0</b><span>Streak</span></div>
        <div class="stat"><b id="statWins">0</b><span>Wins</span></div>
        <div class="stat"><b id="statPlayed">0</b><span>Played</span></div>
      </div>
      <div class="result-actions">
        <button class="btn btn-primary" id="newSongBtn">New song</button>
      </div>
    </section>
  </main>

  <footer>Audio snippets via iTunes Preview · No sign-up, just your ears</footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const SNIPPETS = [1, 2, 4, 8, 15];

/* Curated catalog: widely known songs only.
   Format "Title|Artist" (the artist is what we search for on iTunes). */
const CATALOG = {

    "Columbia|Quevedo","Danza Kuduro|Don Omar","Dile|Don Omar","El Perdón|Nicky Jam","Travesuras|Nicky Jam",

    "Rakata|Wisin & Yandel","Ella Baila Sola|Peso Pluma","La Bebe|Yng Lvcas","Con Altura|ROSALÍA"
  ],
  pop: [
    "Blank Space|Taylor Swift","Shake It Off|Taylor Swift","Love Story|Taylor Swift","Anti-Hero|Taylor Swift",
    "Cruel Summer|Taylor Swift","Style|Taylor Swift","Levitating|Dua Lipa","Don't Start Now|Dua Lipa",
    "New Rules|Dua Lipa","Houdini|Dua Lipa","Blinding Lights|The Weeknd","Starboy|The Weeknd",

/* Built once: each genre -> array of {track, artist, genre} */
const LIBRARY = {};
for(const [id, list] of Object.entries(CATALOG)){
  LIBRARY[id] = list.map(s => {
    const [track, artist] = s.split("|");
    return { track, artist, genre:id };
  });
}
const ALL_SONGS = Object.keys(CATALOG).flatMap(id => LIBRARY[id]);

const $ = id => document.getElementById(id);

  status:$("statusText"), dots:$("attemptDots"), vinyl:$("vinyl"),
  playBtn:$("playBtn"), playIcon:$("playIcon"), fill:$("snippetFill"),
  hint:$("snippetHint"), form:$("guessForm"), input:$("guessInput"),
  submit:$("submitBtn"), skip:$("skipBtn"), history:$("history"),
  result:$("result"), head:$("resultHead"), sub:$("resultSub"),
  art:$("songArt"), title:$("songTitle"), artist:$("songArtist"),
  link:$("songLink"), toast:$("toast"), newSong:$("newSongBtn"), retry:$("retryBtn"),
  streak:$("statStreak"), wins:$("statWins"), played:$("statPlayed"),
  ac:$("acList")
};

/* Every normalized title: prevents accepting as a typo a guess that
   is actually a different song. */
const ALL_TITLES = new Set();

let song = null;
let attempt = 0;
let playing = false;
let stopTimer = null;
let rafId = null;
let currentGenre = "reggaeton";
let loading = false;
let roundToken = 0;
let audio = null;
const recentTracks = [];

/* Cache of resolved previews, persisted across sessions so we don't
   hammer the iTunes API or wait again on songs we've already seen. */
const CACHE_KEY = "songless-previews-v1";
const previewCache = new Map(Object.entries((()=>{
  try{ return JSON.parse(localStorage.getItem(CACHE_KEY)) || {}; }catch{ return {}; }
})()));
let cacheSaveTimer = null;
function persistCache(){
  clearTimeout(cacheSaveTimer);
  cacheSaveTimer = setTimeout(()=>{
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(Object.fromEntries(previewCache))); }catch{}
  }, 400);
}

const norm = s => (s||"").toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/\(.*?\)|\[.*?\]/g," ")
  .replace(/&/g," and ")
  .replace(/[^a-z0-9 ]/g," ")
  .replace(/\b(feat|ft|with|remastered|remaster|version|radio edit|single|deluxe)\b/g," ")
  .replace(/\s+/g," ").trim();

ALL_SONGS.forEach(s => ALL_TITLES.add(norm(s.track)));

function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function levenshtein(a, b){
  if(a === b) return 0;
  if(!a.length || !b.length) return Math.max(a.length, b.length);
  let prev = Array.from({length:b.length+1}, (_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur = [i];
    for(let j=1;j<=b.length;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    }
    prev = cur;
  }
  return prev[b.length];
}

/* ---------- iTunes ---------- */
function jsonp(url){
  return new Promise((resolve, reject) => {
    const cb = "itcb_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const timer = setTimeout(()=>{ cleanup(); reject(new Error("timeout")); }, 8000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error("load error")); };
    s.src = url + "&callback=" + cb;
    document.head.appendChild(s);
  });
}

/* Finds the real preview for one specific catalog song. Only accepts
   results whose title and artist both match, so a random track from
   another genre can never slip in. */
async function resolvePreview(entry){
  const key = entry.artist + "|" + entry.track;
  if(previewCache.has(key)) return previewCache.get(key);

  const q = `${entry.artist} ${entry.track}`;
  const data = await jsonp(
    `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=12&country=US`
  );
  const wantT = norm(entry.track);
  const wantA = norm(entry.artist);
  let best = null, bestScore = -1;

  for(const t of (data && data.results) || []){
    if(t.kind !== "song" || !t.previewUrl) continue;
    const gotT = norm(t.trackName);
    const gotA = norm(t.artistName);
    const titleOk = gotT === wantT || gotT.startsWith(wantT + " ") || levenshtein(gotT, wantT) <= 2;
    const artistOk = gotA.includes(wantA) || wantA.includes(gotA);
    if(!titleOk || !artistOk) continue;
    const meta = t.trackName + " " + (t.collectionName || "");
    // never accept versions that aren't the actual song
    if(/karaoke|tribute|instrumental|made popular by|originally performed|in the style of|8-bit|lullaby/i.test(meta)) continue;
    // prefer the exact match and the original recording
    let score = (gotT === wantT ? 4 : 0) + (gotA === wantA ? 2 : 0);
    if(/live|remix|demo|sped up|slowed|acoustic|re-?recorded/i.test(meta)) score -= 3;
    if(score > bestScore){ bestScore = score; best = t; }
  }
  if(!best) return null;

  const found = {
    track: entry.track,               // the catalog title is the canonical answer
    artist: entry.artist,
    itunesTrack: best.trackName,
    art: (best.artworkUrl100||"").replace("100x100","400x400"),
    url: best.previewUrl,
    link: best.trackViewUrl
  };
  previewCache.set(key, found);
  persistCache();
  return found;
}

/* ---------- game UI ---------- */
function renderDots(){
  els.dots.innerHTML = "";
  SNIPPETS.forEach((sec,i)=>{
    const d = document.createElement("span");
    d.className = "attempt-dot";
    d.title = `Attempt ${i+1}: ${sec}s`;
    if(i < attempt) d.classList.add(song && song.solved ? "won" : "used");
    else if(i === attempt && song && !song.done) d.classList.add("current");
    els.dots.appendChild(d);
  });
}

function setStatus(html){ els.status.innerHTML = html; }

function setPlayingUI(on){
  playing = on;
  els.vinyl.classList.toggle("playing", on);
  els.playIcon.innerHTML = on
    ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  els.playBtn.setAttribute("aria-label", on ? "Pause" : "Play snippet");
}

function stopPlayback(){
  clearTimeout(stopTimer);
  cancelAnimationFrame(rafId);
  if(audio) audio.pause();
  setPlayingUI(false);
  els.fill.style.width = "0%";
}

function playSnippet(){
  if(!song || song.done || playing) return;
  const len = SNIPPETS[Math.min(attempt, SNIPPETS.length-1)];
  if(!audio){ audio = new Audio(); audio.preload = "auto"; }
  if(audio.src !== song.url) audio.src = song.url;
  try{ audio.currentTime = 0; }catch{}
  setPlayingUI(true);
  const playStart = performance.now();
  const tick = () => {
    if(!playing) return;
    const p = Math.min((performance.now()-playStart)/(len*1000), 1);
    els.fill.style.width = (p*100)+"%";
    if(p < 1) rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
  audio.play().then(()=>{
    stopTimer = setTimeout(stopPlayback, len*1000);
  }).catch(()=>{
    setPlayingUI(false);
    cancelAnimationFrame(rafId);
    els.fill.style.width = "0%";
    showToast("Tap the record again to listen");
  });
}

function updateHint(){
  if(!song){ return; }
  if(song.done){ els.hint.textContent = ""; return; }
  const next = SNIPPETS[Math.min(attempt, SNIPPETS.length-1)];
  els.hint.innerHTML = attempt === 0
    ? `First attempt: just <strong>1 second</strong> of the song`
    : `Attempt ${attempt+1}: now you hear <strong>${next} seconds</strong>`;
}

function addHistory(text, cls){
  const li = document.createElement("li");
  li.className = cls;
  li.innerHTML = `<span class="n">${attempt}</span><span class="txt"></span>`;
  li.querySelector(".txt").textContent = text;
  els.history.appendChild(li);
}

function isCorrect(guess){
  const g = norm(guess);
  if(!g) return false;
  const t = norm(song.track);
  if(!t) return false;
  if(g === t) return true;
  if(g === norm(song.artist + " " + song.track)) return true;
  if(g === norm(song.track + " " + song.artist)) return true;
  // if the guess is exactly ANOTHER catalog song, it's wrong:
  // stops "Love Yourself" from passing as "Lose Yourself"
  if(ALL_TITLES.has(g)) return false;
  // typo tolerance scaled to the title length
  const tol = t.length > 14 ? 3 : t.length > 7 ? 2 : 1;
  return levenshtein(g, t) <= tol;
}

function lockGuess(lock){
  els.input.disabled = lock;
  els.submit.disabled = lock;
  els.skip.disabled = lock;
}

function endGame(won){
  song.done = true;
  song.solved = won;
  stopPlayback();
  closeAC();
  lockGuess(true);
  els.playBtn.disabled = true;
  els.input.value = "";
  updateHint();
  renderDots();
  const stats = bumpStats(won);
  els.streak.textContent = stats.streak;
  els.wins.textContent = stats.wins;
  els.played.textContent = stats.played;
  setStatus(won ? `Solved in <strong>${attempt}</strong> of 5` : `No luck this time`);
  els.head.textContent = won ? "Correct!" : "Out of attempts";
  els.head.className = "result-head " + (won ? "good" : "bad");
  els.sub.textContent = won
    ? `You got it on attempt ${attempt} of 5.`
    : `Here's the song. Better luck next time!`;
  els.art.src = song.art || "";
  els.art.alt = `Artwork for ${song.track}`;
  els.title.textContent = song.track;
  els.artist.textContent = song.artist;
  els.link.href = song.link || "#";
  els.link.style.display = song.link ? "" : "none";
  els.result.classList.add("show");
  els.newSong.focus();
}

function nextAttempt(delay){
  if(attempt >= SNIPPETS.length){ endGame(false); return; }
  setStatus(`Attempt <strong>${attempt+1}</strong> of 5`);
  updateHint();
  renderDots();
  setTimeout(playSnippet, delay);
}

function onSubmit(e){
  e.preventDefault();
  if(!song || song.done) return;
  const val = els.input.value.trim();
  if(!val){ showToast("Type a guess first"); return; }
  closeAC();
  if(isCorrect(val)){
    attempt++;
    addHistory(val, "right");
    endGame(true);
    return;
  }
  attempt++;
  addHistory(val, "wrong");
  els.form.classList.remove("shake");
  void els.form.offsetWidth;
  els.form.classList.add("shake");
  els.input.value = "";
  nextAttempt(650);
}

function onSkip(){
  if(!song || song.done) return;
  closeAC();
  attempt++;
  addHistory("Skipped", "skipped");
  els.input.value = "";
  nextAttempt(400);
}

/* ---------- stats ---------- */
function getStats(){
  try{ return JSON.parse(localStorage.getItem("songless-stats")) || {streak:0,wins:0,played:0}; }
  catch{ return {streak:0,wins:0,played:0}; }
}
function bumpStats(won){
  const s = getStats();
  s.played++;
  if(won){ s.wins++; s.streak++; } else { s.streak = 0; }
  try{ localStorage.setItem("songless-stats", JSON.stringify(s)); }catch{}
  return s;
}

let toastTimer = null;
function showToast(msg){
  els.toast.textContent = msg;
  els.toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>els.toast.classList.remove("show"), 2200);
}

/* ---------- custom autocomplete ---------- */
let acItems = [];
let acIndex = -1;

const esc = t => t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Highlights only when the match exists literally in the original text,
   so indexes never drift because of accents or parentheses. */
function highlight(text, rawQuery){
  const i = text.toLowerCase().indexOf(rawQuery);
  if(!rawQuery || i < 0) return esc(text);
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i, i+rawQuery.length)) + "</mark>" + esc(text.slice(i+rawQuery.length));
}

function openAC(list, q){
  acItems = list;
  acIndex = -1;
  if(!list.length){
    els.ac.innerHTML = `<p class="ac-empty">No matches</p>`;
  }else{
    els.ac.innerHTML = list.map((s,i)=>
      `<button type="button" class="ac-item" role="option" id="ac-opt-${i}" aria-selected="false" data-i="${i}">
         <span class="t">${highlight(s.track, q)}</span>
         <span class="a">${highlight(s.artist, q)}</span>
       </button>`).join("");
  }
  els.ac.classList.add("show");
  els.input.setAttribute("aria-expanded","true");
}

function closeAC(){
  els.ac.classList.remove("show");
  els.ac.innerHTML = "";
  els.input.setAttribute("aria-expanded","false");
  els.input.removeAttribute("aria-activedescendant");
  acItems = [];
  acIndex = -1;
}

function moveAC(delta){
  const nodes = els.ac.querySelectorAll(".ac-item");
  if(!nodes.length) return;
  acIndex = (acIndex + delta + nodes.length) % nodes.length;
  nodes.forEach((n,i)=>n.setAttribute("aria-selected", i === acIndex ? "true" : "false"));
  nodes[acIndex].scrollIntoView?.({block:"nearest"});
  els.input.setAttribute("aria-activedescendant", "ac-opt-" + acIndex);
}

function chooseAC(i){
  const s = acItems[i];
  if(!s) return;
  els.input.value = s.track;
  closeAC();
  els.input.focus();
}

function onInput(){
  const raw = els.input.value.trim();
  const rawLower = raw.toLowerCase();
  const q = norm(raw);
  if(q.length < 1){ closeAC(); return; }
  const lib = LIBRARY[currentGenre];
  const starts = [], contains = [];
  for(const s of lib){
    const t = norm(s.track), a = norm(s.artist);
    if(t.startsWith(q)) starts.push(s);
    else if(t.includes(q) || a.includes(q)) contains.push(s);
    if(starts.length >= 8) break;
  }
  openAC([...starts, ...contains].slice(0, 8), rawLower);
}

els.input.addEventListener("input", onInput);
els.input.addEventListener("focus", ()=>{ if(els.input.value.trim()) onInput(); });
els.input.addEventListener("keydown", e => {
  const open = els.ac.classList.contains("show");
  if(e.key === "ArrowDown"){ e.preventDefault(); open ? moveAC(1) : onInput(); }
  else if(e.key === "ArrowUp"){ if(open){ e.preventDefault(); moveAC(-1); } }
  else if(e.key === "Enter"){ if(open && acIndex >= 0){ e.preventDefault(); chooseAC(acIndex); } }
  else if(e.key === "Escape"){ if(open){ e.preventDefault(); closeAC(); } }
});
els.ac.addEventListener("mousedown", e => {
  const item = e.target.closest(".ac-item");
  if(!item) return;
  e.preventDefault();
  chooseAC(Number(item.dataset.i));
});
document.addEventListener("click", e => {
  if(!e.target.closest(".combo")) closeAC();
});

/* ---------- round ---------- */
function pickEntry(){
  const lib = LIBRARY[currentGenre];
  let src = lib.filter(s => !recentTracks.includes(s.artist + "|" + s.track));
  if(!src.length) src = lib.slice();
  return shuffle(src.slice());
}

async function startGame(){
  if(loading) return;
  loading = true;
  const token = ++roundToken;

  stopPlayback();
  closeAC();
  els.result.classList.remove("show");
  els.history.innerHTML = "";
  els.fill.style.width = "0%";
  els.input.value = "";
  attempt = 0;
  song = null;
  els.retry.hidden = true;
  setStatus(`Finding a song · ${GENRES[currentGenre].label}`);
  els.hint.textContent = "Warming up the turntable…";
  lockGuess(true);
  els.playBtn.disabled = true;
  document.querySelectorAll(".chip").forEach(c => c.disabled = true);
  renderDots();

  const candidates = pickEntry();
  let found = null;
  // cached entries first: instant load, zero requests
  const cached = candidates.find(c => previewCache.has(c.artist + "|" + c.track));
  if(cached) found = previewCache.get(cached.artist + "|" + cached.track);

  for(let i = 0; i < candidates.length && i < 8 && !found; i++){
    try{ found = await resolvePreview(candidates[i]); }
    catch{ await new Promise(r => setTimeout(r, 350)); }   // retry with the next one
    if(token !== roundToken) return;         // the user switched genre
  }

  if(token !== roundToken) return;
  loading = false;
  document.querySelectorAll(".chip").forEach(c => c.disabled = false);

  if(!found){
    setStatus("Couldn't load a song");
    els.hint.innerHTML = `No response from iTunes.`;
    els.retry.hidden = false;
    els.retry.focus();
    showToast("No response from iTunes, try again");
    return;
  }

  // background preload of another track in this genre (instant next round)
  const next = candidates.find(c => !previewCache.has(c.artist + "|" + c.track));
  if(next) setTimeout(()=>{ resolvePreview(next).catch(()=>{}); }, 1500);

  song = Object.assign({}, found, {done:false, solved:false});
  recentTracks.push(song.artist + "|" + song.track);
  if(recentTracks.length > 25) recentTracks.shift();

  setStatus(`Attempt <strong>1</strong> of 5`);
  updateHint();
  renderDots();
  lockGuess(false);
  els.playBtn.disabled = false;
  // focus the field on desktop; avoid popping the keyboard on touch
  if(window.matchMedia("(hover: hover)").matches) els.input.focus();
}

/* ---------- genres ---------- */
function renderChips(){
  const bar = $("genreBar");
  Object.entries(GENRES).forEach(([id,g])=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (id === currentGenre ? " active" : "");
    b.dataset.genre = id;
    b.textContent = g.label;
    b.setAttribute("aria-pressed", id === currentGenre ? "true" : "false");
    b.addEventListener("click", ()=>setGenre(id));
    bar.appendChild(b);
  });
}

function setGenre(id){
  if(id === currentGenre) return;
  currentGenre = id;
  document.querySelectorAll(".chip").forEach(c => {
    const on = c.dataset.genre === id;
    c.classList.toggle("active", on);
    c.setAttribute("aria-pressed", on ? "true" : "false");
  });
  roundToken++;        // invalidates any in-flight load
  loading = false;
  stopPlayback();
  startGame();
}

els.playBtn.addEventListener("click", ()=>{ playing ? stopPlayback() : playSnippet(); });
els.form.addEventListener("submit", onSubmit);
els.skip.addEventListener("click", onSkip);
els.newSong.addEventListener("click", ()=>startGame());
els.retry.addEventListener("click", ()=>startGame());
document.addEventListener("keydown", e => {
  if(e.code === "Space" && e.target === document.body && song && !song.done){
    e.preventDefault();
    playing ? stopPlayback() : playSnippet();
  }
});

(function init(){
  renderChips();
  const s = getStats();
  els.streak.textContent = s.streak;
  els.wins.textContent = s.wins;
  els.played.textContent = s.played;
  startGame();
})();
</script>
</body>
</html>
